[project]
name = "rag-platform"
version = "0.1.0.dev0"
description = "Permission-aware connected knowledge platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=9.5,<10",
    "alembic>=1.17,<2",
    "argon2-cffi>=25,<26",
    "celery>=5.5,<6",
    "cryptography>=46,<48",
    "fastapi>=0.121,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.18,<2", "pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.uv]
package = false
required-version = "==0.13.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api/src"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "services/api/src"
files = ["services/api/src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
